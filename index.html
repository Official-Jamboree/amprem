<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Login</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #090910;
    color: #fff;
    padding: 20px;
    max-width: 500px;
    margin: 0 auto;
  }
  h1 { color: #b7a0ff; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #333;
    border-radius: 8px;
    background: #1a1a2a;
    color: #fff;
    font-size: 14px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    background: linear-gradient(100deg, #c4b5fd, #8b8cf7);
    color: #111;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
  }
  .box {
    background: #131421;
    padding: 20px;
    border-radius: 12px;
    margin: 10px 0;
    border: 1px solid #333;
  }
  .log {
    background: #000;
    color: #0f0;
    font-family: monospace;
    font-size: 12px;
    padding: 12px;
    border-radius: 8px;
    margin-top: 20px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .hidden { display: none; }
</style>
</head>
<body>

<h1>🧪 Debug Login</h1>

<!-- LOGIN FORM -->
<div id="loginBox" class="box">
  <h3>Login</h3>
  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">
  <button onclick="doLogin()">LOGIN</button>
  <button onclick="showRegister()" style="background:#333;color:#fff;">Belum punya akun? Daftar</button>
</div>

<!-- REGISTER FORM -->
<div id="registerBox" class="box hidden">
  <h3>Daftar</h3>
  <input type="text" id="regUsername" placeholder="Username baru">
  <input type="password" id="regPassword" placeholder="Password">
  <input type="password" id="regPassword2" placeholder="Konfirmasi Password">
  <button onclick="doRegister()">DAFTAR</button>
  <button onclick="showLogin()" style="background:#333;color:#fff;">← Kembali</button>
</div>

<!-- DASHBOARD -->
<div id="dashboardBox" class="box hidden">
  <h3>✅ Dashboard</h3>
  <p>Selamat datang, <strong id="welcome">User</strong>!</p>
  <p style="color:#8ef0be;">Login berhasil 🎉</p>
  <button onclick="logout()" style="background:#ff6b6b;">LOGOUT</button>
</div>

<!-- LOG -->
<div class="log" id="log">[log] Memulai...</div>

<script>
// ============ LOG FUNCTION ============
function log(msg) {
  const el = document.getElementById('log');
  el.textContent += '\n[log] ' + msg;
  console.log(msg);
}

log('Script loaded ✅');

// ============ HASH PASSWORD ============
function hashPass(p) {
  return btoa(p + '_am_salt_2026');
}

// ============ STORAGE ============
function getUsers() {
  try {
    const data = localStorage.getItem('am_users');
    return data ? JSON.parse(data) : {};
  } catch (e) {
    log('❌ Error getUsers: ' + e.message);
    return {};
  }
}

function saveUsers(users) {
  localStorage.setItem('am_users', JSON.stringify(users));
  log('✅ Users disimpan: ' + Object.keys(users).join(', '));
}

function getSession() {
  return localStorage.getItem('am_session');
}

function setSession(u) {
  localStorage.setItem('am_session', u);
}

function clearSession() {
  localStorage.removeItem('am_session');
}

// ============ UI SWITCH ============
function showRegister() {
  log('Klik DAFTAR');
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('registerBox').classList.remove('hidden');
}

function showLogin() {
  log('Klik KEMBALI');
  document.getElementById('registerBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}

function showDashboard(username) {
  log('Buka dashboard: ' + username);
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('registerBox').classList.add('hidden');
  document.getElementById('dashboardBox').classList.remove('hidden');
  document.getElementById('welcome').textContent = username;
}

// ============ LOGIN ============
function doLogin() {
  log('Klik LOGIN');
  
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  
  log('Username: "' + u + '"');
  log('Password length: ' + p.length);
  
  if (!u || !p) {
    alert('⚠️ Isi username dan password!');
    return;
  }
  
  const users = getUsers();
  log('Users di storage: ' + Object.keys(users).join(', '));
  
  if (!users[u]) {
    alert('❌ Username "' + u + '" tidak ditemukan! Daftar dulu.');
    log('❌ Username tidak ada di storage');
    return;
  }
  
  const hashed = hashPass(p);
  log('Hash input: ' + hashed);
  log('Hash storage: ' + users[u].pass);
  
  if (users[u].pass !== hashed) {
    alert('❌ Password salah!');
    log('❌ Password tidak match');
    return;
  }
  
  log('✅ LOGIN SUKSES!');
  setSession(u);
  showDashboard(u);
  alert('✅ Selamat datang, ' + u + '!');
}

// ============ REGISTER ============
function doRegister() {
  log('Klik DAFTAR');
  
  const u = document.getElementById('regUsername').value.trim();
  const p1 = document.getElementById('regPassword').value;
  const p2 = document.getElementById('regPassword2').value;
  
  log('Username: "' + u + '"');
  log('Password 1 length: ' + p1.length);
  log('Password 2 length: ' + p2.length);
  
  if (!u || !p1 || !p2) {
    alert('⚠️ Isi semua field!');
    return;
  }
  
  if (u.length < 3) {
    alert('⚠️ Username minimal 3 karakter!');
    return;
  }
  
  if (p1.length < 4) {
    alert('⚠️ Password minimal 4 karakter!');
    return;
  }
  
  if (p1 !== p2) {
    alert('❌ Password tidak sama!');
    return;
  }
  
  const users = getUsers();
  
  if (users[u]) {
    alert('❌ Username sudah dipakai!');
    return;
  }
  
  users[u] = {
    pass: hashPass(p1),
    created: Date.now()
  };
  
  saveUsers(users);
  
  log('✅ Register sukses');
  alert('✅ Akun berhasil dibuat! Silakan login dengan username: ' + u);
  
  // Reset form
  document.getElementById('regUsername').value = '';
  document.getElementById('regPassword').value = '';
  document.getElementById('regPassword2').value = '';
  
  // Balik ke login + auto isi username
  document.getElementById('username').value = u;
  document.getElementById('password').value = '';
  showLogin();
}

// ============ LOGOUT ============
function logout() {
  log('Klik LOGOUT');
  clearSession();
  document.getElementById('username').value = '';
  document.getElementById('password').value = '';
  document.getElementById('loginBox').classList.remove('hidden');
  document.getElementById('registerBox').classList.add('hidden');
  document.getElementById('dashboardBox').classList.add('hidden');
  alert('👋 Logout berhasil');
}

// ============ AUTO LOGIN ============
window.addEventListener('load', () => {
  log('Window loaded');
  const session = getSession();
  if (session && getUsers()[session]) {
    log('Auto login: ' + session);
    showDashboard(session);
  }
});

log('Ready! Coba klik tombol.');
</script>
</body>
</html>
